; ============================================================
; 配置文件模板（example）
; 使用步骤：
;   1. 把本文件复制一份，改名为 typo_config.ini（同目录）
;   2. 在 typo_config.ini 里填入你自己的 api_key
;   3. 保存后重新启动主程序
; 注意：typo_config.ini 已被 .gitignore 忽略，不会提交到仓库，
;       请勿把真实 Key 填进本 example 文件再提交。
; ============================================================

[ai]
; 是否启用 AI 校对（true/false）
enabled=true
; 智谱 API Key - 在 https://open.bigmodel.cn 注册后，头像 -> API Keys -> 新建
; 留空时程序会提示"未配置 API Key"，填好后保存并重启主程序
api_key=
; 免费模型（GLM-4-Flash 长期免费）
model=glm-4-flash
; API 接口地址（一般无需修改）
base_url=https://open.bigmodel.cn/api/paas/v4/chat/completions
; 每次 AI 调用超时时间（秒），网络慢可调大，如 15~20
timeout=15
; 发送给 AI 的最大文本长度（字符）
max_text=500

[log]
; 调试日志：true 会在 config 目录生成 ai_debug.log，记录每次 AI 调用详情（请求/响应/耗时）
debug=false

[hotkey]
; 触发热键，格式同 AutoHotkey：
;   F8、F9、F10 等=功能键；^=Ctrl  !=Alt  +=Shift（如 ^F8=Ctrl+F8、!F8=Alt+F8）
; 修改后保存，重新双击主程序生效
key=F8

[ui]
; 一键修正后是否在右下角弹"已修正并回填"提醒（true=弹，false=不弹）
tray_tip=false
