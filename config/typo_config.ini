[ai]
; Enable AI proofreading (true/false)
enabled=true
; Zhipu API Key - get it at https://open.bigmodel.cn (Personal Center -> API Keys)
; After filling, set enabled=true and restart the tool
api_key=XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
; Free model (GLM-4-Flash is permanently free)
model=glm-4-flash
; API endpoint (usually no need to change)
base_url=https://open.bigmodel.cn/api/paas/v4/chat/completions
; Timeout in seconds for each API call (网络慢可调大，如 15~20)
timeout=15
; Max text length sent to AI (characters)
max_text=500
; Go 版无需 python_cmd，直接运行同目录的 check_ai.exe（免 Python 环境）

[log]
; 调试日志：true 会在同目录生成 ai_debug.log，记录每次 AI 调用详情（请求/响应/耗时）
debug=false

[hotkey]
; 触发热键，格式同 AutoHotkey：
;   F8、F9、F10 等=功能键；^=Ctrl  !=Alt  +=Shift（如 ^F8=Ctrl+F8、!F8=Alt+F8）
; 修改后保存，重新双击「错字检查.exe」生效
key=F8

[ui]
; 一键修正后是否在右下角弹"已修正并回填"提醒（true=弹，false=不弹）
tray_tip=false
