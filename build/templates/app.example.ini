; ============================================================
; 部署参数模板（app.example.ini）
;
; 本文件是「部署参数」的模板源，位于 build\templates\。
; 运行 build\build.ps1 时：
;   1. 复制到 dist\config\app.example.ini
;   2. 若 dist\config\app.ini 不存在，则由本模板生成一份
;   （app.ini 已存在时绝不覆盖，你的 api_key 不会被冲掉）
;
; 「部署参数」= 只影响运行、与编译无关的设置。
; 需要改「怎么编译」（Go/windres 路径、是否 strip）请改 build\dev.env.ps1，不要动这里。
;
; 注意：含真实 api_key 的 dist\config\app.ini 已被 .gitignore 忽略，不会提交到仓库。
; ============================================================

[ai]
; 是否启用（true/false）
enabled=true
; 云端 API Key —— 留空时程序会提示"未配置 API Key"
;   DeepSeek: https://platform.deepseek.com  → API Keys
;   智谱 GLM: https://open.bigmodel.cn       → 头像 → API Keys
api_key=
; 模型名（必须与下面的 base_url 属于同一家）
model=deepseek-v4-flash
; API 接口地址
base_url=https://api.deepseek.com/v1/chat/completions
; 每次调用超时时间（秒），网络慢可调大，如 15~20
timeout=15
; 单次发送给 AI 的最大文本长度（字符）；超过会自动分块（重叠 30 字后拼接）
max_text=5000

; ---- 换厂商：只改上面 model + base_url 两行即可 ----
;   DeepSeek : model=deepseek-v4-flash   base_url=https://api.deepseek.com/v1/chat/completions
;   智谱 GLM : model=glm-4-flash         base_url=https://open.bigmodel.cn/api/paas/v4/chat/completions
;   自建/中转: model=<服务商给的模型名>    base_url=<服务商给的 /v1/chat/completions 地址>

[log]
; 调试日志：true 会在 config 目录生成 ai_debug.log，记录每次调用详情（请求/响应/耗时）
debug=false

[server]
; 常驻服务端口（前端会自动拉起 check_ai.exe -server，并通过它通信）
; 仅在端口被其他程序占用时才需要修改
port=18765

[hotkey]
; 语句润色热键，格式同 AutoHotkey：
;   F9、F10 等=功能键；^=Ctrl  !=Alt  +=Shift（如 ^F9=Ctrl+F9、!F9=Alt+F9）
; 修改后保存，重新双击 mosq-ai-fix.exe 生效
polish_key=F9

[ui]
; 替换原文后是否在右下角弹"润色完成"提醒（true=弹，false=不弹）
tray_tip=false

[startup]
; 开机自启动（仅 Windows）：true=登录时自动运行本程序
; 无需管理员权限（写入当前用户 HKCU\...\Run）；默认关闭
auto_start=false
